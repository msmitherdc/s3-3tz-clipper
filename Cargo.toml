[package]
name = "s3-3tz-clipper"
version = "1.0.8"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
clap = { version = "4.4", features = ["derive"] }
# `default-https-client` is the modern SDK TLS stack (hyper 1.x + rustls 0.23/aws-lc);
# the legacy `rustls` feature pinned the deprecated hyper 0.14 + rustls 0.21 +
# rustls-webpki 0.101 stack, which has open RUSTSEC advisories and duplicated the entire
# HTTP stack alongside reqwest's.
aws-config = { version = "1.1.7", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async_zip = { version = "0.0.18", features = ["tokio", "deflate", "zstd"] }
geojson = "1.0"
geo = "0.33"
serde_json = "1.0"
futures = "0.3"
indicatif = "0.18"
s2 = "0.1"
md5 = "0.8"
crc32fast = "1.3"
flate2 = "1.0"
zip = "8.6.0"
zstd = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
