[workspace]
# This is a binary, not a library: nothing goes to crates.io. `git_only` both skips
# `cargo publish` and switches version detection to git tags matching `git_tag_name` below,
# instead of querying the registry.
#
# Note this must NOT be expressed as `publish = false` in Cargo.toml: release-plz excludes
# such packages entirely, so it would report "nothing to release" and never tag anything.
#
# `publish` must be set explicitly alongside it: release-plz only rejects the combination when
# `publish` is explicitly `true`, so leaving it unset silently falls back to the default (true)
# and it attempts `cargo publish` anyway.
git_only = true
publish = false
git_release_enable = true
git_tag_enable = true
# Tag history is mixed: `1.0` through `1.0.8` are bare, but the most recent release is
# `v1.0.9`. Follow the newest convention (also release-plz's default) so version detection
# sees v1.0.9 as the latest release and continues from there. A bare pattern would ignore
# v1.0.9 and cut a duplicate 1.0.9.
git_tag_name = "v{{ version }}"
